model:
  _class: cool_blob.model.AmixCrossAttentionClickCachedFixedTotalMultiLabel
  anatomix_ckpt: ''
  anatomix_num_downs: 5
  anatomix_ngf: 32
  anatomix_output_nc: 32
  anatomix_norm: instance
  embedding_norm: channel
  anatomix_pooling: Avg
  anatomix_interp: trilinear
  anatomix_tile_size:
  - 128
  - 128
  - 128
  anatomix_sw_batch_size: 1
  anatomix_sw_overlap: 0.25
  anatomix_sw_mode: gaussian
  anatomix_autocast_dtype: bf16
  anatomix_compile: true
  anatomix_compile_mode: default
  freeze_anatomix: false
  attn_embed_dim: 128
  attn_num_heads: 8
  attn_dropout: 0.1
  attn_activation: gelu
  attn_q_chunk_size: 16384
  num_target_voxels_per_class: 1024
  num_context_voxels_total_per_class: 2048
  context_border_fraction: 0.0
  context_border_kernel_size: 3
  target_sampling: proportional
  target_sampling_min_voxels_per_class: 5
  compile: false
  attn_block: transformer
  token_type_dim: 8
  prediction_tokens: true
  prediction_tokens_budget: 1024
  prediction_tokens_selection: random
  prediction_tokens_dropout: 0.0
