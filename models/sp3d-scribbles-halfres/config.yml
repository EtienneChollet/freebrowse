data:
  _class: interseg3d.datasets.thunderpack_with_context.v5_4.multisegment3d.MultiBinarySegment3D
  version: v5.4
  resolution: -2
  samples_per_epoch: 1000
  sampling: hierarchical
  min_label_density: 12.5
  label_type: hard
  train_datasets:
  - ABIDE
  - ACDC
  - ADHD200
  - ADNI
  - ATM
  - AbdomenAtlas
  - AbdomenCT_1k
  - BTCV
  - BraTS
  - CHAOS
  - CT_ORG
  - DukeLiver
  - FeTA
  - GSP
  - HaN_Seg
  - I2CVB
  - ISBI_Prostate
  - KiTS
  - MCIC
  - MSD
  - OASIS
  - PPMI
  - PROMISE12
  - SLIVER
  - SPIDER
  - SegTHOR
  - Spine_Mets_CT_Seg
  - TDSC
  - ToothFairy
  - TotalSegmentator/MR_v1
  - TotalSegmentator/v2
  - UCSF_BMSR
  - WORD
  - autoPET
  - cDEMRIS
  val_datasets:
  - AMOS
  - COBRE
  - LiTS
  generator:
    _class: interseg3d.datasets.collate.CollateTaskWithContext
    include_task_name: true
    target_transform:
      _class: monai.transforms.Compose
      lazy: true
      transforms:
      - _class: monai.transforms.CropForegroundd
        keys:
        - vol
        - seg
        source_key: vol
      - _class: interseg3d.augmentation.spatial.ResizeToMaxDimd
        keys:
        - vol
        - seg
        min_dim_size: 512
        modes:
        - linear
        - nearest
      - _class: monai.transforms.DivisiblePadd
        keys:
        - vol
        - seg
        k: 32
dataloader:
  collate_fn:
    _class: interseg3d.datasets.collate.CollateBatchPadToMax
    include_task_name: true
  context_size: 0
  batch_sampler:
    _class: interseg3d.datasets.batch_samplers.UniformBatchSampler
    batch_size: 3
    samples_per_epoch: 1000
    drop_last: false
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
callbacks:
  epoch:
  - pylot.callbacks.PrintLogged
  - pylot.callbacks.JobProgress
  - pylot.callbacks.ETA
  - pylot.callbacks.TerminateOnNaN
  - pylot.callbacks.ModelCheckpoint:
      monitor: dice_score
      phase: val_id
  - pylot.callbacks.ModelCheckpoint:
      monitor: dice_score
      phase: val_od
  - interseg3d.callbacks.WandbLogger:
      project: 2026-03-27_ce-prompts
      entity: interseg3d
      group: voxel-clicks_scribbles
loss_func:
  _class: interseg3d.nn.losses.DiceCELoss
  batch_reduction: null
  from_logits: true
  mode: binary
  dice_weight: 1.0
  ce_weight: 1.0
experiment:
  seed: 42
log:
  checkpoint_freq: 10
  metrics:
    dice_score:
      _fn: pylot.metrics.dice_score
      batch_reduction: null
      from_logits: true
      mode: binary
  root: /orcd/scratch/seedfund/001/scribbleprompt/output/2026-03-27_ce-prompts
  save_freq: 100
model:
  _class: interseg3d.models.neurite.BasicUNet
  ndim: 3
  in_channels: 5
  out_channels: 1
  nb_features:
  - 4
  - 16
  - 64
  - 256
  - 256
  compile: false
  final_activation: null
  order: ca
optim:
  _class: torch.optim.Adam
  lr: 0.0001
prompts:
  _class: interseg3d.prompts3d.prompt_generator_v4.SuperFlexiblePrompt3D
  do_initial_click_prob: 0.5
  do_click_prob: 0.5
  init_pos_clicks:
  - 1
  - 10
  init_neg_clicks:
  - 0
  - 10
  correction_clicks:
  - 1
  - 10
  pos_click_channel: 2
  neg_click_channel: 3
  do_initial_scribble_prob: 0.5
  do_scribble_prob: 0.5
  init_scribbles:
  - 1
  - 3
  correction_scribbles:
  - 1
  - 3
  partition_correction_scribbles: true
  init_pos_scribble_generators:
  - _class: interseg3d.prompts2d.scribbles.LineScribble
    warp: true
    warp_smoothing:
    - 8
    - 16
    warp_magnitude:
    - 1
    - 3
    mask_smoothing:
    - 4
    - 16
    thickness: 1
    preserve_scribble: true
    warp_binarize_threshold: 0.25
    max_pixels: null
    max_pixels_smooth: 42
  init_neg_scribble_generators:
  - _class: interseg3d.prompts2d.scribbles.LineScribble
    warp: true
    warp_smoothing:
    - 8
    - 16
    warp_magnitude:
    - 1
    - 3
    mask_smoothing:
    - 4
    - 16
    thickness: 1
    preserve_scribble: true
    warp_binarize_threshold: 0.25
    max_pixels: null
    max_pixels_smooth: 42
  correction_scribble_generators:
  - _class: interseg3d.prompts2d.scribbles.LineScribble
    warp: true
    warp_smoothing:
    - 8
    - 16
    warp_magnitude:
    - 1
    - 3
    mask_smoothing:
    - 4
    - 16
    thickness: 1
    preserve_scribble: true
    warp_binarize_threshold: 0.25
    max_pixels: null
    max_pixels_smooth: 42
  do_initial_bbox_prob: 0.0
  include_previous_prediction: false
  include_previous_logits: true
  from_logits: true
train:
  epochs: 10000
  eval_freq: 10
  prompt_iter: 2
  bf16: true
  grad_accumulation: false
  repeat_batch_elements: false
